<script>
(function () {
    var ID = 'zxsos-fullscreen-btn';
    var ENTER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
    var EXIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M16 3v3a2 2 0 0 0 2 2h3M8 21v-3a2 2 0 0 0-2-2H3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';

    function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function toggle() {
        var el = document.documentElement;
        if (!isFullscreen()) {
            (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        } else {
            (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        }
    }

    function sync() {
        var b = document.getElementById(ID);
        if (!b) return;
        b.innerHTML = isFullscreen() ? EXIT : ENTER;
        b.title = isFullscreen() ? '退出全屏' : '进入全屏';
        b.setAttribute('aria-label', b.title);
    }

    function mount() {
        if (document.getElementById(ID)) return false;
        var host = document.querySelector('.toolbar') || document.querySelector('.toolbar-manage');
        if (!host) return false;
        var b = document.createElement('button');
        b.id = ID;
        b.type = 'button';
        b.className = 'zxsos-fullscreen-btn';
        b.addEventListener('click', toggle);
        host.appendChild(b);
        sync();
        return true;
    }

    document.addEventListener('fullscreenchange', sync);
    document.addEventListener('webkitfullscreenchange', sync);

    // SPA 路由切换会重建工具栏，用观察者保证按钮常驻
    if (window.MutationObserver) {
        new MutationObserver(mount).observe(document.body, { childList: true, subtree: true });
    }
    document.addEventListener('DOMContentLoaded', mount);
    mount();
    setInterval(mount, 1000);
})();
</script>
