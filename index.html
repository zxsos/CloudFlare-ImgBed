<script>
(function () {
    var WRAP_ID = 'zxsos-tools';
    var FS_ID = 'zxsos-fullscreen-btn';

    var FS_ENTER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
    var FS_EXIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M16 3v3a2 2 0 0 0 2 2h3M8 21v-3a2 2 0 0 0-2-2H3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';
    var STAT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M7 20v-6M12 20V8M17 20v-10"/></svg>';

    function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function toggleFullscreen() {
        var el = document.documentElement;
        if (!isFullscreen()) {
            (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        } else {
            (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        }
    }

    function syncFs() {
        var b = document.getElementById(FS_ID);
        if (!b) return;
        b.innerHTML = isFullscreen() ? FS_EXIT : FS_ENTER;
        b.title = isFullscreen() ? '退出全屏' : '进入全屏';
        b.setAttribute('aria-label', b.title);
    }

    function build() {
        if (document.getElementById(WRAP_ID)) return;

        var wrap = document.createElement('div');
        wrap.id = WRAP_ID;
        wrap.className = 'zxsos-tools';

        var stat = document.createElement('a');
        stat.className = 'zxsos-tool-btn';
        stat.href = '/folder-stats';
        stat.title = '文件夹占用统计';
        stat.setAttribute('aria-label', '文件夹占用统计');
        stat.innerHTML = STAT;
        wrap.appendChild(stat);

        var fs = document.createElement('button');
        fs.className = 'zxsos-tool-btn';
        fs.id = FS_ID;
        fs.type = 'button';
        fs.innerHTML = FS_ENTER;
        fs.addEventListener('click', toggleFullscreen);
        wrap.appendChild(fs);

        document.body.appendChild(wrap);
        syncFs();
    }

    document.addEventListener('fullscreenchange', syncFs);
    document.addEventListener('webkitfullscreenchange', syncFs);

    // 只执行一次，不监听 DOM 变化，避免与 Vue 渲染互相触发
    if (document.body) build();
    else document.addEventListener('DOMContentLoaded', build);
})();
</script>
