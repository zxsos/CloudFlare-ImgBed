<script>
(function () {
    var WRAP_ID = 'zxsos-tools';

    // 认证码：从地址栏保存到 Cookie，后续管理端接口自动携带
    (function () {
        try {
            var m = location.search.match(/[?&]authCode=([^&]*)/);
            if (m && m[1]) {
                document.cookie = 'authCode=' + encodeURIComponent(m[1]) +
                    '; path=/; max-age=31536000; samesite=lax';
            }
        } catch (e) {}
    })();

    var FS_ID = 'zxsos-fullscreen-btn';
    var STAT_ID = 'zxsos-stats-btn';
    var MODAL_ID = 'zxsos-stats-modal';

    var FS_ENTER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
    var FS_EXIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M16 3v3a2 2 0 0 0 2 2h3M8 21v-3a2 2 0 0 0-2-2H3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';
    var STAT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M7 20v-6M12 20V8M17 20v-10"/></svg>';
    var CLOSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';

    function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function toggleFullscreen() {
        var el = document.documentElement;
        if (!isFullscreen()) {
            (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        } else {
            (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        }
    }

    function syncFs() {
        var b = document.getElementById(FS_ID);
        if (!b) return;
        b.innerHTML = isFullscreen() ? FS_EXIT : FS_ENTER;
        b.title = isFullscreen() ? '退出全屏' : '进入全屏';
        b.setAttribute('aria-label', b.title);
    }

    function isAdminPage() {
        var p = location.pathname || '';
        var h = location.hash || '';
        return p.indexOf('/dashboard') === 0 || h.indexOf('/dashboard') === 0;
    }

    function closeModal() {
        var m = document.getElementById(MODAL_ID);
        if (m && m.parentNode) m.parentNode.removeChild(m);
    }

    function openStats() {
        if (document.getElementById(MODAL_ID)) return;
        var m = document.createElement('div');
        m.id = MODAL_ID;
        m.className = 'zxsos-modal';
        m.innerHTML =
            '<div class="zxsos-modal-box">' +
                '<div class="zxsos-modal-bar"><span>文件夹占用统计</span>' +
                '<button type="button" class="zxsos-modal-close" aria-label="关闭">' + CLOSE + '</button></div>' +
                '<iframe src="/folder-stats?embed=1" title="文件夹占用统计"></iframe>' +
            '</div>';
        document.body.appendChild(m);
        m.querySelector('.zxsos-modal-close').addEventListener('click', closeModal);
        m.addEventListener('click', function (e) { if (e.target === m) closeModal(); });
    }

    function build() {
        if (document.getElementById(WRAP_ID)) return;

        var wrap = document.createElement('div');
        wrap.id = WRAP_ID;
        wrap.className = 'zxsos-tools';

        var stat = document.createElement('button');
        stat.id = STAT_ID;
        stat.className = 'zxsos-tool-btn';
        stat.type = 'button';
        stat.innerHTML = STAT;
        stat.title = '文件夹占用统计';
        stat.setAttribute('aria-label', '文件夹占用统计');
        stat.addEventListener('click', openStats);
        wrap.appendChild(stat);

        var fs = document.createElement('button');
        fs.id = FS_ID;
        fs.className = 'zxsos-tool-btn';
        fs.type = 'button';
        fs.innerHTML = FS_ENTER;
        fs.addEventListener('click', toggleFullscreen);
        wrap.appendChild(fs);

        document.body.appendChild(wrap);
        syncFs();
        syncVisibility();
    }

    // 只在管理端显示统计入口；仅切换 display，不触碰 Vue 管理的 DOM
    function syncVisibility() {
        var s = document.getElementById(STAT_ID);
        if (s) s.style.display = isAdminPage() ? '' : 'none';
        autoLoadMore();
    }

    // 分页控件已移除：滚动到底自动触发「加载更多」
    var lastAutoLoad = 0;
    function autoLoadMore() {
        if (!isAdminPage()) return;
        var now = Date.now();
        if (now - lastAutoLoad < 1500) return;
        var btn = document.querySelector('.load-more');
        if (!btn || btn.disabled) return;
        var rect = btn.getBoundingClientRect();
        if (rect.top < window.innerHeight + 120) {
            lastAutoLoad = now;
            btn.click();
        }
    }
    window.addEventListener('scroll', autoLoadMore, { passive: true });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeModal();
    });
    document.addEventListener('fullscreenchange', syncFs);
    document.addEventListener('webkitfullscreenchange', syncFs);

    if (document.body) build();
    else document.addEventListener('DOMContentLoaded', build);

    setInterval(syncVisibility, 1500);
})();
</script>
